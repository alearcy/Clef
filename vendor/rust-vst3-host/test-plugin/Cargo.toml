[package]
name = "vst3-host-testplug"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "A tiny deterministic VST3 test synth (note expression + effect passthrough) for verifying vst3-host"

[lib]
# A VST3 plugin is a C dynamic library.
crate-type = ["cdylib"]

[dependencies]
vst3 = { workspace = true }

[features]
clef-latency-fixture = []
clef-insert-fixture = ["clef-latency-fixture"]
# Clef T43: an instrument with four stereo outputs (bus 0 main) and a stereo sidechain input.
clef-multi-bus-fixture = ["clef-latency-fixture"]
# Clef T43: the multi-bus instrument with a mono main output that refuses stereo.
clef-mono-main-fixture = ["clef-multi-bus-fixture"]
